<link rel="stylesheet" href="../styles.css">
<div style="display:flex;gap:12px;height:140px;font-family:var(--font-body)">
<div style="flex:1;background:var(--success);border-radius:var(--radius-lg);display:flex;align-items:flex-end;padding:12px;color:#fff;font:var(--text-caption)">success</div>
<div style="flex:1;background:var(--danger);border-radius:var(--radius-lg);display:flex;align-items:flex-end;padding:12px;color:#fff;font:var(--text-caption)">danger</div>
<div style="flex:1;background:var(--warning);border-radius:var(--radius-lg);display:flex;align-items:flex-end;padding:12px;color:#fff;font:var(--text-caption)">warning</div>
</div>
